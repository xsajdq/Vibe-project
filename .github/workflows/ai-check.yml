name: AI provider smoke test

# Diagnostyka połączenia z API AI (bez ujawniania klucza): lista modeli, czas odpowiedzi
# i status dla trybów odpowiedzi używanych przez Workera.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-check.yml'
      - '.github/ai-check/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BASE: https://generativelanguage.googleapis.com/v1beta/openai
    steps:
      - uses: actions/checkout@v4
      - name: Key present
        run: '[ -n "$AI_API_KEY" ] && echo "AI_API_KEY: ustawiony (${#AI_API_KEY} znaków)" || echo "AI_API_KEY: BRAK"'

      - name: Available flash models
        run: |
          curl -s -m 30 "$BASE/models" -H "Authorization: Bearer $AI_API_KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(sorted(m['id'] for m in d.get('data',[]) if 'flash' in m['id'])) or d)"

      - name: Chat completions
        run: |
          set +e
          schema=',"response_format":{"type":"json_schema","json_schema":{"name":"t","strict":true,"schema":{"type":"object","additionalProperties":false,"required":["a","b"],"properties":{"a":{"type":"string"},"b":{"type":["string","null"]}}}}}'
          for model in gemini-3.8-flash gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.5-flash-lite gemini-flash-latest gemini-2.5-flash; do
            for effort in none low; do
              [ "$effort" = none ] && re='' || re=',"reasoning_effort":"low"'
              body='{"model":"'$model'"'$re',"messages":[{"role":"user","content":"Zwróć JSON {\"a\":\"ok\",\"b\":null}"}]'$schema'}'
              out=$(curl -s -m 25 -o resp.txt -w '%{http_code} %{time_total}s' "$BASE/chat/completions" \
                -H "Authorization: Bearer $AI_API_KEY" -H 'Content-Type: application/json' -d "$body")
              echo "$model / effort=$effort → $out → $(head -c 250 resp.txt 2>/dev/null | tr '\n' ' ')"
              rm -f resp.txt
            done
          done

      - name: Real worker request (prompt + schema)
        run: |
          set +e
          for model in gemini-2.5-flash gemini-3.5-flash-lite; do
            for variant in as-is no-effort json-object string-content; do
              python3 - "$model" "$variant" > body.json <<'PY'
          import json, sys
          model, variant = sys.argv[1], sys.argv[2]
          body = json.load(open('.github/ai-check/request.json'))
          body['model'] = model
          if variant == 'no-effort':
              body.pop('reasoning_effort')
          if variant == 'json-object':
              body['response_format'] = {'type': 'json_object'}
          if variant == 'string-content':
              body['messages'][1]['content'] = ''.join(p.get('text', '') for p in body['messages'][1]['content'])
          print(json.dumps(body))
          PY
              out=$(curl -s -m 40 -o resp.txt -w '%{http_code} %{time_total}s' "$BASE/chat/completions" \
                -H "Authorization: Bearer $AI_API_KEY" -H 'Content-Type: application/json' --data @body.json)
              echo "$model / $variant → $out → $(head -c 400 resp.txt 2>/dev/null | tr '\n' ' ')"
            done
          done
